# Home Assistant's own checklist, kept here as the plan it is. Bronze is
# the first tier: set up from the UI, standard shape, tested, documented.
#
# Statuses are `done`, `exempt` (with the reason) and `todo` (with what
# is left). Nothing validates this file for a custom integration, so it
# is honest or it is useless.
rules:
  # Actions are registered in `async_setup`, so an automation naming one
  # validates whether or not a bar has been added yet.
  action-setup: done

  # A poll every 30 seconds for the handful of settings that are not on
  # the state stream, and 5 seconds while firmware is installing. Almost
  # everything else arrives pushed.
  appropriate-polling: done

  brands:
    status: todo
    comment: >-
      The images are cut and waiting in brand/ - see its README. They
      have to be merged into home-assistant/brands, which is a separate
      repository and a separate pull request.

  # coordinator.py holds the coordinator, entity.py the base entity.
  common-modules: done

  config-flow: done

  config-flow-test-coverage:
    status: todo
    comment: >-
      91% today - discovery, the picker, a bar already added, a bar with
      its HTTP API off. The eight uncovered lines are the error paths of
      minting a token.

  # busylib is on PyPI, built from a public repository by its own CI.
  dependency-transparency: done

  docs-actions:
    status: todo
    comment: >-
      Every action is described in strings.json, which is what the UI
      shows; the README does not list them with examples.

  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.

  docs-high-level-description:
    status: todo
    comment: The README opens with detail rather than with what this is.

  docs-installation-instructions:
    status: todo
    comment: >-
      Adding the custom repository, the HTTP API switch on the bar, and
      the access key are in the config flow's own strings and nowhere a
      person can read before installing.

  docs-removal-instructions:
    status: todo
    comment: Nothing says what removing it leaves behind on the bar.

  docs-triggers:
    status: exempt
    comment: >-
      The bar's buttons and wheel are event entities, which Home
      Assistant turns into triggers itself.

  # Listeners are added in async_added_to_hass and removed with
  # async_on_remove.
  entity-event-setup: done

  entity-unique-id: done
  has-entity-name: done
  runtime-data: done

  # The flow talks to the bar before it writes an entry: an announced bar
  # that does not answer is aborted by name, not stored.
  test-before-configure: done

  # Setup raises ConfigEntryNotReady when the bar is unreachable, and
  # ConfigEntryAuthFailed when the token is refused.
  test-before-setup: done

  # The device id is the unique id, and a rediscovered bar updates the
  # address of the entry that already has it.
  unique-config-entry: done
