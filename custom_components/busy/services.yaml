stop_session:
  target:
    entity:
      integration: busy

pause_session:
  target:
    entity:
      integration: busy

resume_session:
  target:
    entity:
      integration: busy

next_phase:
  target:
    entity:
      integration: busy

set_theme:
  target:
    entity:
      integration: busy
  fields:
    theme:
      required: true
      example: meeting
      selector:
        select:
          mode: dropdown
          custom_value: true
          options:
            - back_soon
            - booked
            - busy
            - chill_time
            - coding
            - dnd
            - flow
            - keep_out
            - low_social_battery
            - lunch
            - meeting
            - on_air
            - on_call
    mode:
      selector:
        select:
          mode: dropdown
          options:
            - busy
            - custom

play_sound:
  target:
    entity:
      integration: busy
  fields:
    sound:
      required: true
      selector:
        select:
          mode: dropdown
          options:
            # The three short names busylib keeps, and the six files the
            # firmware actually ships.
            - event
            - reminder
            - volume
            - calendar_event_starts
            - calendar_reminder_ends
            - volume_change
            - countdown_tick
            - countdown_finish
            - session_completed

clear:
  target:
    entity:
      integration: busy

list_assets:
  target:
    entity:
      integration: busy

draw:
  target:
    entity:
      integration: busy
  fields:
    text:
      required: true
      example: "ON AIR"
      selector:
        text:
    display:
      default: front
      selector:
        select:
          options:
            - front
            - back
    font:
      default: small
      selector:
        select:
          mode: dropdown
          options:
            - tiny
            - small
            - normal
            - condensed
            - bold
            - large
            - extra_large
            - superscript
    color:
      example: [255, 255, 255]
      selector:
        color_rgb:
    duration:
      default: 10
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
    placement:
      collapsed: true
      fields:
        align:
          selector:
            select:
              mode: dropdown
              options:
                - top_left
                - top_mid
                - top_right
                - mid_left
                - center
                - mid_right
                - bottom_left
                - bottom_mid
                - bottom_right
        x:
          default: 0
          selector:
            number:
              min: -4096
              max: 4095
              mode: box
        y:
          default: 0
          selector:
            number:
              min: -4096
              max: 4095
              mode: box
        width:
          selector:
            number:
              min: 1
              max: 4095
              mode: box
        scroll_rate:
          example: 600
          selector:
            number:
              min: 0
              max: 10000
              mode: box
        scroll_start_delay:
          example: 1000
          selector:
            number:
              min: 0
              max: 60000
              mode: box
        led_color:
          example: [255, 0, 0]
          selector:
            color_rgb:
        interrupt:
          default: false
          selector:
            boolean:
        name:
          example: on_air
          selector:
            text:
