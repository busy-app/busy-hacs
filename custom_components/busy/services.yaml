notify:
  target:
    device:
      integration: busy
  fields:
    line_1:
      required: true
      example: "Laundry done"
      selector:
        text:
    line_2:
      example: "Unload it"
      selector:
        text:
    icon:
      default: none
      example: check
      selector:
        select:
          mode: dropdown
          options:
            - none
            - check
            - error
            - info
            - clock
            - hourglass
            - low_battery
            - start
            - setup
    sound:
      default: none
      selector:
        select:
          options:
            - none
            - event
            - reminder
            - volume
    duration:
      default: 10
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: seconds
    appearance:
      collapsed: true
      fields:
        font:
          default: small
          selector:
            select:
              mode: dropdown
              options:
                - tiny
                - small
                - normal
                - condensed
                - bold
                - large
                - extra_large
        line_1_color:
          example: [255, 255, 255]
          selector:
            color_rgb:
        line_2_color:
          example: [255, 255, 255]
          selector:
            color_rgb:
        background_color:
          example: [0, 0, 0]
          selector:
            color_rgb:

start_session:
  target:
    device:
      integration: busy
  fields:
    mode:
      default: busy
      selector:
        select:
          mode: dropdown
          options:
            - busy
            - custom
    kind:
      example: countdown
      selector:
        select:
          mode: dropdown
          options:
            - endless
            - countdown
            - pomodoro
    duration:
      example: 25
      selector:
        number:
          min: 5
          max: 1440
          unit_of_measurement: minutes
          mode: box
    theme:
      # The themes the firmware ships; custom_value takes one an owner
      # uploaded, and busylib checks the name against that bar.
      selector:
        select:
          mode: dropdown
          custom_value: true
          options:
            - back_soon
            - booked
            - busy
            - chill_time
            - coding
            - dnd
            - flow
            - keep_out
            - low_social_battery
            - lunch
            - meeting
            - on_air
            - on_call
    rest:
      example: 5
      selector:
        number:
          min: 5
          max: 1440
          unit_of_measurement: minutes
          mode: box
    cycles:
      example: 3
      selector:
        number:
          min: 1
          max: 12
          mode: box

stop_session:
  target:
    device:
      integration: busy

pause_session:
  target:
    device:
      integration: busy

resume_session:
  target:
    device:
      integration: busy

next_phase:
  target:
    device:
      integration: busy

set_theme:
  target:
    device:
      integration: busy
  fields:
    theme:
      required: true
      example: meeting
      selector:
        select:
          mode: dropdown
          custom_value: true
          options:
            - back_soon
            - booked
            - busy
            - chill_time
            - coding
            - dnd
            - flow
            - keep_out
            - low_social_battery
            - lunch
            - meeting
            - on_air
            - on_call
    mode:
      selector:
        select:
          mode: dropdown
          options:
            - busy
            - custom

play_sound:
  target:
    device:
      integration: busy
  fields:
    sound:
      required: true
      selector:
        select:
          mode: dropdown
          options:
            - event
            - reminder
            - volume

clear:
  target:
    device:
      integration: busy
