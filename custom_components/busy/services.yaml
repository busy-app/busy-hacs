notify:
  target:
    entity:
      integration: busy
  fields:
    line_1:
      required: true
      example: "Laundry done"
      selector:
        text:
    line_2:
      example: "Unload it"
      selector:
        text:
    icon:
      example: check
      # Long on purpose: the icons the firmware ships, including the Draw
      # Tool's set, whose names are the ones the Draw Tool shows.
      selector:
        select:
          mode: dropdown
          options:
            - check
            - error
            - info
            - clock
            - hourglass
            - low_battery
            - start
            - setup
            - dt_apple_green
            - dt_apple_red
            - dt_apple_yellow
            - dt_available
            - dt_basketball
            - dt_book
            - dt_burger
            - dt_chicken
            - dt_coctail
            - dt_coffee
            - dt_crescent_moon_1
            - dt_crescent_moon_2
            - dt_dialog
            - dt_dialog_no
            - dt_dialog_yes
            - dt_drink_1
            - dt_drink_2
            - dt_emoji_angry
            - dt_emoji_awkward
            - dt_emoji_cry
            - dt_emoji_dead
            - dt_emoji_evil
            - dt_emoji_expressionless
            - dt_emoji_eyes
            - dt_emoji_fatigue
            - dt_emoji_glasses
            - dt_emoji_grinning
            - dt_emoji_happy
            - dt_emoji_heart_eyes
            - dt_emoji_laught
            - dt_emoji_melted
            - dt_emoji_panic
            - dt_emoji_relief
            - dt_emoji_sad
            - dt_emoji_sleep
            - dt_emoji_surprised
            - dt_emoji_sweat_smile
            - dt_emoji_tounge
            - dt_football
            - dt_heart_blue
            - dt_heart_green
            - dt_heart_light_blue
            - dt_heart_orange
            - dt_heart_pink
            - dt_heart_red
            - dt_heart_violet
            - dt_heart_yellow
            - dt_home
            - dt_leaf
            - dt_moon_1
            - dt_moon_2
            - dt_no
            - dt_pie
            - dt_pizza
            - dt_pizza_margarita
            - dt_pizza_peperoni
            - dt_sparkls_1
            - dt_sparkls_2
            - dt_study
            - dt_tea
            - dt_tennis
            - dt_toast
            - dt_tomato
            - dt_unavailable
            - dt_work
            - dt_yes
    sound:
      selector:
        select:
          mode: dropdown
          options:
            # The three short names busylib keeps, and the six files the
            # firmware actually ships.
            - event
            - reminder
            - volume
            - calendar_event_starts
            - calendar_reminder_ends
            - volume_change
            - countdown_tick
            - countdown_finish
            - session_completed
    duration:
      default: 10
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: seconds
    interrupt:
      default: false
      selector:
        boolean:
    appearance:
      collapsed: true
      fields:
        line_1_font:
          default: small
          selector:
            select:
              mode: dropdown
              options:
                - tiny
                - small
                - normal
                - condensed
                - bold
                - large
                - extra_large
        line_2_font:
          # Two lines fit only the five shorter fonts, so the two tallest
          # are not offered here - they are a single line's option.
          selector:
            select:
              mode: dropdown
              options:
                - tiny
                - small
                - normal
                - condensed
                - bold
        line_1_color:
          example: [255, 255, 255]
          selector:
            color_rgb:
        line_2_color:
          example: [255, 255, 255]
          selector:
            color_rgb:
        background_color:
          example: [0, 0, 0]
          selector:
            color_rgb:

start_busy:
  target:
    entity:
      integration: busy
  fields:
    theme:
      # The themes the firmware ships; custom_value takes one an owner
      # uploaded, and busylib checks the name against that bar.
      selector:
        select:
          mode: dropdown
          custom_value: true
          options:
            - back_soon
            - booked
            - busy
            - chill_time
            - coding
            - dnd
            - flow
            - keep_out
            - low_social_battery
            - lunch
            - meeting
            - on_air
            - on_call

