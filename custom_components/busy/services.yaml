      example: 25
      selector:
        number:
          min: 5
          max: 480
          unit_of_measurement: minutes
          mode: box
    rest:
      example: 5
      selector:
        number:
          min: 5
          max: 480
          unit_of_measurement: minutes
          mode: box
    cycles:
      example: 4
      selector:
        number:
          min: 2
          max: 35
          mode: box
    theme:
      # The themes the firmware ships; custom_value takes one an owner
      # uploaded, and busylib checks the name against that bar.
